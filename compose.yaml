services:
  tail:
    build: .
    command: ["tail"]
    env_file: .env
    volumes: ["./data:/app/data", "./state:/app/state"]
    restart: unless-stopped
  backfill:
    build: .
    command: ["backfill", "--until", "${BACKFILL_UNTIL:-90d}"]
    env_file: .env
    volumes: ["./data:/app/data", "./state:/app/state"]
    restart: unless-stopped
    depends_on: [tail]
